<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#236f62">
  <meta name="description" content="왕과 귀족의 주문을 받고 고려청자를 만들어 보세요. 모양을 고르고, 무늬를 새기고, 가마에서 구워 완성하는 좋은 청자 위대한 청자!">
  <title>좋은 청자 위대한 청자</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='3' y='3' width='94' height='94' rx='26' fill='%2386d6ae' stroke='%23573b31' stroke-width='6'/%3E%3Cpath d='M40 20h20v12c0 8 20 8 18 25L67 85H33L22 57c-2-17 18-17 18-25z' fill='%23d4f0b4' stroke='%23573b31' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preload" href="./assets/fonts/Hakgyoansim-BoardmarkerR.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./arcade.css">
  <link rel="stylesheet" href="./stations.css">
  <link rel="stylesheet" href="./clay-workshop.css">
  <link rel="stylesheet" href="./shape-workshop.css">
  <link rel="stylesheet" href="./decoration-workshop.css">
  <link rel="stylesheet" href="./inspection-workshop.css">
  <link rel="stylesheet" href="./kiln-workshop.css">
  <link rel="stylesheet" href="./reactions.css">
  <link rel="stylesheet" href="./desk-props.css">
  <link rel="stylesheet" href="./finish-workshop.css">
  <link rel="stylesheet" href="./game-onboarding.css">
  <link rel="stylesheet" href="./mobile-game.css">
  <link rel="preload" href="./assets/loading/girl-run.webp" as="image" fetchpriority="high">
  <link rel="preload" href="./assets/loading/boy-run.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="./game-loading.css">
  <script type="module" src="./game-bootstrap.js"></script>
</head>
<body>
  <main id="app" inert></main>
  <section id="game-loading" class="game-loading" data-phase="loading" data-progress="0" aria-label="게임 불러오기" aria-busy="true">
    <div class="loading-card">
      <p class="loading-brand">좋은 청자, 위대한 청자</p>
      <h1>도공들이 공방으로 달려가요</h1>
      <div class="loading-stage" aria-hidden="true">
        <img class="loading-dust first" src="./assets/loading/dust.webp" alt="">
        <div class="loading-runner" data-runner="girl"></div>
        <img class="loading-dust second" src="./assets/loading/dust.webp" alt="">
        <div class="loading-runner" data-runner="boy"></div>
      </div>
      <div class="loading-progress-row"><div id="loading-progress" class="loading-progress" role="progressbar" aria-label="공방 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress-fill"></div></div><span id="loading-percent" aria-hidden="true">0%</span></div>
      <p id="loading-status" role="status">공방을 준비하고 있어요.</p>
      <button id="loading-retry" type="button" hidden>다시 불러오기</button>
      <noscript>게임을 시작하려면 자바스크립트를 켜 주세요.</noscript>
    </div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="popup" class="popup"></dialog>
  <dialog id="museum" class="popup museum-popup">
    <button class="close" data-action="close-museum" aria-label="3D 도감 닫기">×</button>
    <h2>빙글빙글 청자 3D 도감</h2>
    <p class="muted">박물관의 청자를 돌려 보고 모양과 쓰임을 찾아보세요.</p>
    <div id="model-tabs"></div>
    <div id="model-viewer" aria-label="선택한 청자의 3D 모형"></div>
  </dialog>
</body>
</html>
